    <script>
        const base = document.getElementsByTagName('base')[0];

            base.setAttribute('href', '/');

            base.setAttribute('href', window.location.pathname);

    <script>
        //localStorage writes are best-effort in this app: a full quota (or storage disabled in private
        //browsing) must never throw into Blazor's interop layer, which pops the framework's fatal-error bar
        //even when the app has handled the failure. Wrapping setItem here — before Blazor boots, so its
        //storage layer captures the wrapped version — swallows the error and flags it; LocalAppStorage polls
        //that flag after each write and raises a friendly "storage is full" warning instead of crashing.
        (function () {
            try {
                const proto = window.Storage && window.Storage.prototype;

                if (!proto || proto.__gdbvSafeSetItem)
                    return;

                const original = proto.setItem;
                let failed = false;

                proto.setItem = function (key, value) {
                    try {
                        return original.call(this, key, value);
                    }
                    catch (e) {
                        failed = true;
                    }
                };

                proto.__gdbvSafeSetItem = true;

                window.gdbvStorage = {
                    //Returns whether a write has failed since the last call, then clears the flag.
                    takeWriteFailed: function () {
                        const f = failed;
                        failed = false;
                        return f;
                    }
                };
            }
            catch (e) { }
        })();
    </script>

    <!-- One three.js for the whole page: the import map above resolves "three" to the vendored module,
         and 3d-force-graph is bundled (tools/vendor-three.mjs in the Treeality repo) to import that same
         "three" rather than carry a copy of its own — two copies on one page cannot share textures, which
         is what the Globe needs. Both are exposed as globals so the classic interop scripts can use them
         without themselves becoming modules; a module script runs after the document is parsed, and
         nothing below needs either until Blazor has booted and asked for a draw.

         THE UMD BUNDLE IS GONE, not merely unused: the 2026-09-13 core sync deleted
         3d-force-graph.min.js, and this page went on asking for it for one test run — a 404, no
         ForceGraph3D, and a 3D view that rendered no canvas at all while everything else passed. -->
    <script type="module">

        import ForceGraph3D from './_content/GraphDBViewer.Core/lib/js/3d-force-graph.esm.min.js';

        window.ForceGraph3D = ForceGraph3D;
    </script>
