    <base />
    <script>
        const base = document.getElementsByTagName('base')[0];

        if (window.location.host.includes('localhost')) { //When developing.
            base.setAttribute('href', '/');
        } else {
            base.setAttribute('href', window.location.pathname);
        }
    </script>
    <script>
        //localStorage writes are best-effort in this app: a full quota (or storage disabled in private
        //browsing) must never throw into Blazor's interop layer, which pops the framework's fatal-error bar
        //even when the app has handled the failure. Wrapping setItem here — before Blazor boots, so its
        //storage layer captures the wrapped version — swallows the error and flags it; LocalAppStorage polls
        //that flag after each write and raises a friendly "storage is full" warning instead of crashing.
        (function () {
            try {
                const proto = window.Storage && window.Storage.prototype;

                if (!proto || proto.__gdbvSafeSetItem)
                    return;

                const original = proto.setItem;
                let failed = false;

                proto.setItem = function (key, value) {
                    try {
                        return original.call(this, key, value);
                    }
                    catch (e) {
                        failed = true;
                    }
                };

                proto.__gdbvSafeSetItem = true;

                window.gdbvStorage = {
                    //Returns whether a write has failed since the last call, then clears the flag.
                    takeWriteFailed: function () {
                        const f = failed;
                        failed = false;
                        return f;
                    }
                };
            }
            catch (e) { }
        })();
    </script>
